    const alphabet = 'ABCÇDEFGĞHIİJKLMNOÖPRSŞTUÜVYZ'.split('');
    const letterDiv = document.getElementById('letterFilters');
    alphabet.forEach(l => {
      const b = document.createElement('button');
      b.className = 'btn';
      b.innerText = l;
      b.onclick = (e) => filterLetter(l, e);
      letterDiv.appendChild(b);
    });

    let activeLen = 0;
    let activeLetter = '';
    let searchQuery = '';

    function render() {
      const filtered = allWords.filter(w => {
        if (activeLen === 9 && w.length < 9) return false;
        if (activeLen > 0 && activeLen < 9 && w.length !== activeLen) return false;
        if (activeLetter && !w.startsWith(activeLetter)) return false;
        if (searchQuery && !w.includes(searchQuery)) return false;
        return true;
      });

      document.getElementById('stats').innerText = filtered.length.toLocaleString('tr-TR') + ' kelime listeleniyor';
      const grid = document.getElementById('grid');
      const displayList = filtered.slice(0, 2000);
      grid.innerHTML = displayList.map(w =>
        '<div class="word-card">' + w + '<span class="word-len">(' + w.length + ')</span></div>'
      ).join('');
      if (filtered.length > 2000) {
        grid.innerHTML += '<div style="grid-column: 1 / -1; text-align: center; padding: 16px; color: #E5A93C;">... ve ' + (filtered.length - 2000).toLocaleString('tr-TR') + ' kelime daha (harf veya arama seçerek filtreleyebilirsiniz)</div>';
      }
    }

    function filterLen(l, e) {
      activeLen = l;
      document.querySelectorAll('#lengthFilters .btn').forEach(b => b.classList.remove('active'));
      (e ? e.target : window.event.target).classList.add('active');
      render();
    }

    function filterLetter(l, e) {
      activeLetter = l;
      document.querySelectorAll('#letterFilters .btn').forEach(b => b.classList.remove('active'));
      (e ? e.target : window.event.target).classList.add('active');
      render();
    }

    document.getElementById('search').addEventListener('input', (e) => {
      searchQuery = e.target.value.toLocaleUpperCase('tr-TR').trim();
      render();
    });

    render();
  </script>
